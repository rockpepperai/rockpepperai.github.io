<!DOCTYPE html>
<html lang="en">

{% include head.html %}
<body>
  <div class="container">
    <header class="site-header">
      <div class="site-title"><a href="{{ page.url | prepend: site.baseurl }}">{{ site.title }}</a></div>
      <p class="site-description">{{ site.description }}</p>
      <nav class="site-nav">
        <a href="/">Home</a>{% for page in site.pages %}{% if page.title and page.includelink %}<a href="{{ page.url | prepend: site.baseurl }}">{{ page.title }}</a>{% endif %}{% endfor %}
      </nav>
    </header>
    <main>
      {{ content }}
    </main>
  </div>
  {% include footer.html %}
</body>
</html>
